description: >-
  Rite Aid does not operate a public developer portal or publish API pricing. Vendor and
  partner integrations (EDI, B2B, pharmacy data) are negotiated through Rite Aid's vendor
  relations channel and are gated to approved counterparties.
notes: >-
  No public pricing page exists. Engagement with Rite Aid integrations is partner-only and
  governed by individual contract terms. Trimmed to a single contact-sales placeholder.
sources:
  - https://www.riteaid.com/
plans:
  - id: rite-aid-contact-sales
    name: Contact Sales
    type: enterprise
    description: >-
      Vendor and partner integrations (EDI 850/810/856, B2B services, digital health) are
      negotiated directly with Rite Aid vendor relations. No public pricing is published.
    entries:
      - label: Negotiated vendor terms
        name: vendor_terms
        type: flat
        metric: varies
        limit: -1
        timeFrame: usage
        geo: US
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: EDI Trading Partner Setup
      - name: Approved Vendor Onboarding
      - name: Contractual SLA
