principles:
  - name: Visibility
    description: >-
      Track Rite Aid integration spend through the vendor master file and AP system; there is
      no provider-side usage API to consume.
  - name: Allocation
    description: >-
      Allocate Rite Aid vendor charges to the merchandising or pharmacy program that owns the
      trading-partner relationship.
  - name: Optimization
    description: >-
      Re-negotiate contract terms at renewal; consolidate EDI VAN spend across retail
      counterparties where feasible.
  - name: Accountability
    description: >-
      Vendor relations and supply-chain leads own the Rite Aid partner relationship and review
      contracted terms annually.
